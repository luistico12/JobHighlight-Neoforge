name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Beim Upload ueber den Browser geht das Ausfuehrbar-Flag von gradlew verloren
      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      - name: Bauen
        run: ./gradlew build

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jobhighlight-jar
          path: build/libs/*.jar

      # Bei einem Tag wie v1.0.0 wird automatisch ein GitHub-Release mit der JAR erstellt
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
